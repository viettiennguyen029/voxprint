[package]
name = "blueprint"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "blueprint"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for Claude API
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI argument parsing
clap = { version = "4", features = ["derive", "env"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Terminal output (progress + colors)
indicatif = "0.17"
colored = "2"

# Date/time for output filename
chrono = "0.4"
